[package]
name = "electrobun-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Public SDK for `mainProcess: "zig"` (now "native") apps. Loads libElectrobunCore
# at runtime via libloading and exposes a typed, safe Rust API over its C ABI.
[lib]
name = "electrobun_sdk"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
