[package]
name = "electrobun-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Produces libElectrobunCore.{dylib,so} / ElectrobunCore.dll, loaded by Bun via
# bun:ffi (main + worker threads). It dlopens the C++ libNativeWrapper at runtime.
[lib]
name = "ElectrobunCore"
crate-type = ["cdylib"]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
sha1 = "0.10"
base64 = "0.22"
once_cell = "1"
libc = "0.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "socket", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
] }
